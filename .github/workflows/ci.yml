name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: syntra
          POSTGRES_PASSWORD: syntra
          POSTGRES_DB: syntra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U syntra" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt
      - name: Unit and workflow tests (test evidence for validation/test_protocol.md)
        run: python -m pytest -v --junitxml=test-results.xml
      - name: Smoke test against PostgreSQL (schema, append-only guard, hash chain)
        env:
          DATABASE_URL: postgresql+psycopg://syntra:syntra@localhost:5432/syntra
        run: python smoke_pg.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-test-results, path: backend/test-results.xml }

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t syntra-api ./backend
      - run: docker build -t syntra-frontend ./frontend
