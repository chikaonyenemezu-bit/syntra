server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Built JS/CSS have content hashes in their names: safe to cache for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The page itself must be re-checked on every load, so a new release shows up after a normal reload.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
